plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yuriaaaaa.sonicr'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.yuriaaaaa.sonicr'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // The repo's DATA/ extras, copied into the player's data folder on first run.
            assets.srcDirs = ["$buildDir/generated/sonicr-assets"]
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('copyDataExtras', Copy) {
    from("${rootDir}/../DATA") {
        exclude 'SOUND/DCSFX/**'   // Dreamcast-only sound set
        exclude 'GENERAL/SONICR.ICO'
    }
    into "$buildDir/generated/sonicr-assets/DATA"
}
preBuild.dependsOn copyDataExtras
